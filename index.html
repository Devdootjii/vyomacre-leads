<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VyomAcre — List your rooftop</title>
  <meta name="description" content="Rent out your rooftop in Lucknow. Solar, telecom towers and brands are looking for space. No advance, no commission, no hidden charges." />
  <meta name="theme-color" content="#050A08" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Fonts load without blocking the first paint. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" />
  </noscript>

  <!-- Critical inline CSS: something is on screen before any JS or font loads,
       so there is never an empty black page. -->
  <style>
    html, body { margin: 0; background: #050A08; }
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: #050A08;
      transition: opacity .28s ease;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .m { position: relative; width: 36px; height: 36px; }
    #boot .m::before, #boot .m::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid #1C2A22;
    }
    #boot .m::after { inset: 8px; border-color: #16281F; }
    #boot .m i {
      position: absolute; left: 50%; top: 50%; width: 11px; height: 11px;
      margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: #00E585;
      box-shadow: 0 0 14px rgba(0, 229, 133, .7);
      animation: bootPulse 1.4s ease-in-out infinite;
    }
    #boot .n { font-size: 16px; font-weight: 700; color: #F4F8F5; letter-spacing: -.01em; }
    #boot .n span { color: #00E585; }
    @keyframes bootPulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #boot .m i { animation: none; } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="m"><i></i></div>
    <div class="n">Vyom<span>Acre</span></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
